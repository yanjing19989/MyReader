name: Package

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-windows:
    name: Package Windows (${{ matrix.packager }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - packager: pyinstaller
            artifact: MyReader-pyinstaller-windows-x64
    env:
      PACKAGER: ${{ matrix.packager }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install application dependencies
        run: uv sync --frozen --no-dev

      - name: Install PyInstaller
        if: matrix.packager == 'pyinstaller'
        run: uv pip install "pyinstaller>=6,<7"

      - name: Build with PyInstaller
        if: matrix.packager == 'pyinstaller'
        shell: pwsh
        run: |
          $timer = [System.Diagnostics.Stopwatch]::StartNew()
          uv run --no-sync pyinstaller `
            --noconfirm `
            --clean `
            --onedir `
            --name MyReader `
            --icon frontend/favicon.ico `
            --paths . `
            --add-data "frontend/dist;frontend/dist" `
            --collect-all uvicorn `
            app/__main__.py
          $exitCode = $LASTEXITCODE
          $timer.Stop()
          Write-Host "PyInstaller build elapsed: $($timer.Elapsed)"
          if ($exitCode -ne 0) {
            throw "PyInstaller failed with exit code $exitCode"
          }
          $dist = Resolve-Path dist/MyReader
          "PACKAGE_DIR=$dist" >> $env:GITHUB_ENV

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ env.PACKAGE_DIR }}
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package-windows
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release archives
        shell: pwsh
        run: |
          $artifactDirs = @(Get-ChildItem artifacts -Directory)
          if ($artifactDirs.Count -eq 0) {
            throw "No artifact directories found under artifacts/."
          }
          foreach ($dir in $artifactDirs) {
            $zip = "artifacts/$($dir.Name).zip"
            Compress-Archive -Path "$($dir.FullName)\*" -DestinationPath $zip
            $zipInfo = Get-Item $zip
            Write-Host ("ZIP {0}: {1:N2} MiB ({2:N0} bytes)" -f $zipInfo.Name, ($zipInfo.Length / 1MB), $zipInfo.Length)
          }

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          $archives = @(Get-ChildItem artifacts -Filter *.zip -File | ForEach-Object FullName)
          if ($archives.Count -eq 0) {
            throw "No release archives found under artifacts/."
          }

          if (gh release view $env:GITHUB_REF_NAME --repo $env:GH_REPO 2>$null) {
            foreach ($archive in $archives) {
              gh release upload $env:GITHUB_REF_NAME $archive --repo $env:GH_REPO --clobber
            }
          } else {
            gh release create $env:GITHUB_REF_NAME $archives --repo $env:GH_REPO --generate-notes
          }
